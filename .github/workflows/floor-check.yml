name: Floor Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only MODULE ROOTS are init+validated here. The examples/**/versions.tf floors are
        # floor-shape-policed by the `convention` job below (baseline-or-receipt), not
        # init-validated — examples are compositions, not published modules.
        include:
          - { module: modules/dns-record, tf: "1.3.0" }
          - { module: modules/efs-access, tf: "1.3.0" }
          - { module: modules/launcher, tf: "1.3.0" }
          - { module: modules/notice-discord, tf: "1.3.0" }
          - { module: modules/notice-github, tf: "1.3.0" }
          - { module: modules/notice-parameter-store, tf: "1.3.0" }
          - { module: modules/persistence, tf: "1.3.0" }
          - { module: modules/service, tf: "1.9.0" }
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.terraform.io:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Assert matrix floor == module's declared required_version"
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          # Keep the matrix honest against versions.tf: a matrix value that drifts above (or
          # below) the declared floor would silently test the wrong version, breaking the
          # "exact declared floor" promise. Fail loudly instead.
          # `|| true`: without it a no-match grep aborts under pipefail before the friendly error.
          # `|| true` is SAFE HERE, and only because of the test BELOW: an empty value is
          # compared `!=` against the matrix pin, so a failed scan lands in the FAILURE branch
          # rather than the pass branch. That safety is a property of the following test, not of
          # this line - change the test and this becomes the fail-open shape.
          #
          # AND THESE TESTS NOW CARRY A SECOND DUTY THEY WERE NOT WRITTEN FOR, stated because it
          # was picked up silently: they are this job's ONLY guard on the empty-checkout / wrong
          # working-directory route. `grep -rn` over such a tree exits 1, so `all=""` and the
          # decomposed scan below reads clean; what actually reds that world is `declared=` not
          # matching the matrix pin, or `-z "$root"` firing. An unstated duty is one refactor from
          # being dropped by someone who only reads what the test appears to be for.
          declared=$(grep -oE 'required_version *= *">= [0-9]+\.[0-9]+\.[0-9]+"' versions.tf | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ "$declared" != "${{ matrix.tf }}" ]; then
            echo "::error::floor-check matrix pins ${{ matrix.tf }} but ${{ matrix.module }}/versions.tf declares >= ${declared:-<none>} — update the matrix to match the declared floor"
            exit 1
          fi
          echo "matrix floor ${{ matrix.tf }} matches declared >= $declared"
      - name: "Setup Terraform (pinned to declared floor)"
        uses: step-security/setup-terraform@11f45fe036ccfd27d231861d38b183d405b059a9 # v4.0.0
        with:
          terraform_version: ${{ matrix.tf }}
          terraform_wrapper: false
      - name: "Fetch modules over public HTTPS (no org secret in PR validation)"
        run: |
          # null-label / null-context are PUBLIC, so init needs no credentials. Rewrite the
          # SSH module sources (both the scp-shorthand and the ssh:// form go-getter
          # normalizes to) to anonymous HTTPS, keeping the org SSH key OUT of PR-controlled
          # `terraform init`.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: "Init + validate at exact floor"
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  convention:
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Floors self-police: baseline silent, deviations documented"
        run: |
          set -euo pipefail
          # Every required_version must be exactly the ">= 1.3.0" baseline OR carry a
          # "# floor-reason:" receipt. This one assertion subsumes "no >= 0.13" and
          # "no ~> caps" (those lines are neither baseline nor receipted) and makes the
          # convention executable instead of a rule that lives in a Discord scroll.
          # Only the stage that touches the FILESYSTEM can have an I/O ERROR; the filter stages
          # read a variable and cannot.
          # NARROWED DELIBERATELY: "cannot error" would be too broad. `grep -vE` still exits 2 on
          # an INVALID PATTERN, and the trailing `|| true` would collapse that to bad="" -> a
          # pass. It is unreachable HERE only because `root` is constrained to a three-part
          # numeric by its own extraction regex. That is a property of THIS derivation, not of
          # the shape - and this shape propagates to repos whose root= sites differ. Loosen the
          # derivation and this stage needs the explicit case treatment the scan stage has. So the error space is preserved exactly where it exists,
          # and `|| true` stays where it is genuinely safe.
          # WHY NOT A SINGLE PIPELINE WITH AN rc CHECK: under `pipefail` the status is the
          # RIGHTMOST non-zero, so a first-stage `grep -rn` error (2) followed by a legitimate
          # last-stage `grep -v` no-match (1) reports 1 - the error masked by a downstream clean.
          # An rc check on the old form would have looked correct and changed nothing.
          rc=0
          all=$(grep -rn 'required_version' --include='*.tf' .) || rc=$?
          case "$rc" in
            0) ;;
            1) all="" ;;
            *)
              echo "::error::floor scan FAILED (grep rc=$rc) - this is NOT a clean result; the floor gate did not run"
              exit 1
              ;;
          esac
          bad=$(printf '%s\n' "$all" | grep -vE "required_version += +\">= ${root//./\\.}\"" | grep -v 'floor-reason:') || true
          if [ -n "$bad" ]; then
            echo "::error::each required_version must be '>= 1.3.0' (baseline) or carry a '# floor-reason:' receipt"
            echo "$bad"
            exit 1
          fi
          echo "floors: baseline silent, deviations documented"
