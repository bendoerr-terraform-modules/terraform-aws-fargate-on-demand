# Thin caller -> reusable lint in bendoerr-terraform-modules/workflows (SHA-pinned, big-blast).
# golangci ON via the reusable's golangci_workdirs matrix: this repo is multi-module (6 modules,
# each modules/<m>/test/go.mod), so golangci runs once per module dir (go_version_file derived
# <workdir>/go.mod, fail-fast off). Each module carries its own test/.golangci.yml (org strict preset,
# local-prefixes = this repo's umbrella path). terraform_docs stays OFF (baseline runs none; separate
# drift-fix). Pins neither tflint/markdownlint knob -> empty (action defaults).
# egress uses reusable default (functionality-preserving superset of this repo's set; the default
# additionally allows Go toolchain download endpoints since workflows#16 -> wider egress than before).
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: bendoerr-terraform-modules/workflows/.github/workflows/lint.yml@93e740f8fea20eda37207f4afd2908325972851e # v1.2.7
    with:
      # Org default allowlist + storage.googleapis.com — the Go module proxy
      # redirects zip downloads there, and any dependency version not already in
      # the runner cache dies at egress without it (bit this repo on PR #555).
      # Follow-up filed to add it to the org default in `workflows`; drop this
      # override when that ships.
      allowed-endpoints: >
        api.github.com:443
        check.trivy.dev:443
        checkpoint-api.hashicorp.com:443
        dl.google.com:443
        files.pythonhosted.org:443
        ghcr.io:443
        github.com:22
        github.com:443
        go.dev:443
        golang.org:443
        mirror.gcr.io:443
        objects.githubusercontent.com:443
        pkg-containers.githubusercontent.com:443
        proxy.golang.org:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
        releases.hashicorp.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tuf-repo-cdn.sigstore.dev:443
      golangci: true
      golangci_workdirs: '["modules/launcher/test","modules/persistence/test","modules/dns-record/test","modules/notice-github/test","modules/notice-discord/test","modules/notice-parameter-store/test","modules/efs-access/test"]'
      terraform_docs: false
      tflint_version: ""
      markdownlint_flags: ""
  paperwork:
    # Tripwire for repos born from the template: fails until the new-repo checklist
    # (top of README.md) is completed. Skipped in the template itself.
    if: github.repository != 'bendoerr-terraform-modules/terraform-module-repo-template'
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Template paperwork done?"
        run: |
          set -euo pipefail
          fail=0
          todos=$(git grep -n 'TEMPLATE_TODO_' -- ':!.github' || true)
          if [ -n "$todos" ]; then
            echo "::error::unfilled template placeholders remain — complete the new-repo checklist at the top of terraform-module-repo-template's README"; echo "$todos"; fail=1
          fi
          # Substring 'repo-template' is INTENTIONALLY loose: it catches the full repo
          # name (README URLs, test/go.mod, test/.golangci.yml) AND ctx.tf's shorter
          # role string ("terraform-aws-repo-template"); the full name would miss the
          # latter. Scope is a DENYLIST like its sibling above — an allowlist of
          # expected files needed hand-extending twice in one morning; the name goes
          # wherever it likes. A child legitimately named *repo-template* would trip
          # this forever — change the needle if that day ever comes.
          selfrefs=$(git grep -n 'repo-template' -- ':!.github' || true)
          if [ -n "$selfrefs" ]; then
            echo "::error::template self-references remain (badges/links/example role still point at the template) — see the new-repo checklist at the top of terraform-module-repo-template's README"; echo "$selfrefs"; fail=1
          fi
          exit $fail

      - name: "Coverage truth"
        run: python3 .github/scripts/coverage-truth.py
